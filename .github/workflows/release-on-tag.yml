name: Release on Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v1.3.4)'
        required: true
        type: string
      draft:
        description: 'Create a draft release for review'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish this fork
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify release version and notes
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/verify-release.cjs "$RELEASE_TAG"
          release_notes="docs/releases/${RELEASE_TAG}.md"
          test -s "$release_notes"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "notes=${release_notes}" >> "$GITHUB_OUTPUT"
          echo "archive=dist/live-assistant-${RELEASE_TAG#v}.zip" >> "$GITHUB_OUTPUT"

      - name: Check, test and build the reproducible extension package
        run: npm run package

      - name: Publish GitHub Release in the current repository
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release.outputs.notes }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256
